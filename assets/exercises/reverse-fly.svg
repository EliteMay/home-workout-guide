<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">リバースフライの開始姿勢と腕を開いた姿勢</title><desc id="desc">前傾姿勢でダンベルを肩の下へ下げ、肘を軽く曲げたまま左右へ開く。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79d7a5"/></marker><style>.panel{fill:#171a21;stroke:#2b323d;stroke-width:2}.label{fill:#79d7a5;font:800 21px system-ui,sans-serif}.note{fill:#aeb7c4;font:600 17px system-ui,sans-serif}.body{fill:#dce4eb}.limb{stroke:#dce4eb;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke:#dce4eb;stroke-width:16;stroke-linecap:round;fill:none}.accent{stroke:#79d7a5;stroke-width:8;stroke-linecap:round;fill:none}.floor{stroke:#46505d;stroke-width:5;stroke-linecap:round}.arrow{fill:none;stroke:#79d7a5;stroke-width:8;stroke-linecap:round;marker-end:url(#arrow)}.db{fill:#79d7a5}.tip{fill:#f2f4f7;font:800 21px system-ui,sans-serif}.chair{fill:none;stroke:#6c7784;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="960" height="420" rx="24" fill="#11151b"/><rect class="panel" x="24" y="24" width="430" height="372" rx="20"/><rect class="panel" x="506" y="24" width="430" height="372" rx="20"/><text class="label" x="52" y="62">① 開始</text><text class="note" x="52" y="90">前傾して腕を肩の下へ</text><circle class="body" cx="190" cy="142" r="25"/><line class="limb" x1="204" y1="165" x2="260" y2="236"/><line class="limb" x1="260" y1="236" x2="330" y2="298"/><line class="thin" x1="224" y1="188" x2="202" y2="282"/><line class="thin" x1="235" y1="195" x2="258" y2="282"/><rect class="db" x="187" y="280" width="30" height="18" rx="4"/><rect class="db" x="244" y="280" width="30" height="18" rx="4"/><line class="limb" x1="260" y1="236" x2="205" y2="318"/><line class="limb" x1="260" y1="236" x2="323" y2="318"/><text class="label" x="534" y="62">② 動作</text><text class="note" x="534" y="90">肘を横へ開く</text><circle class="body" cx="672" cy="142" r="25"/><line class="limb" x1="686" y1="165" x2="742" y2="236"/><line class="limb" x1="742" y1="236" x2="812" y2="298"/><line class="thin" x1="706" y1="190" x2="622" y2="208"/><line class="thin" x1="718" y1="196" x2="804" y2="212"/><rect class="db" x="603" y="200" width="31" height="18" rx="4"/><rect class="db" x="799" y="204" width="31" height="18" rx="4"/><line class="limb" x1="742" y1="236" x2="687" y2="318"/><line class="limb" x1="742" y1="236" x2="805" y2="318"/><path class="arrow" d="M696 279C672 252 646 229 621 215"/><path class="arrow" d="M746 278C765 254 787 232 808 218"/><text class="tip" x="480" y="408" text-anchor="middle">肩をすくめず、ダンベルではなく肘を横へ運ぶ</text></svg>
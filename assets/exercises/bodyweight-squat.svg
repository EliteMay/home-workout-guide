<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">自重スクワットの開始姿勢としゃがんだ姿勢</title>
  <desc id="desc">左は肩幅前後で立った開始姿勢。右はかかとを床につけ、お尻を後ろへ引きながらしゃがんだ姿勢。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79d7a5"/></marker>
    <style>
      .panel{fill:#171a21;stroke:#2b323d;stroke-width:2}.label{fill:#79d7a5;font:800 21px system-ui,sans-serif}.note{fill:#aeb7c4;font:600 18px system-ui,sans-serif}.body{fill:#dce4eb}.limb{stroke:#dce4eb;stroke-width:24;stroke-linecap:round;stroke-linejoin:round}.joint{fill:#79d7a5}.floor{stroke:#46505d;stroke-width:5;stroke-linecap:round}.arrow{fill:none;stroke:#79d7a5;stroke-width:8;stroke-linecap:round;marker-end:url(#arrow)}.guide{stroke:#79d7a5;stroke-width:6;stroke-dasharray:10 10}.tip{fill:#f2f4f7;font:800 22px system-ui,sans-serif}
    </style>
  </defs>
  <rect width="960" height="420" rx="24" fill="#11151b"/>
  <rect class="panel" x="24" y="24" width="430" height="372" rx="20"/>
  <rect class="panel" x="506" y="24" width="430" height="372" rx="20"/>

  <text class="label" x="52" y="62">① 開始</text>
  <text class="note" x="52" y="90">足は肩幅前後、かかとまで床につける</text>
  <line class="floor" x1="95" y1="345" x2="390" y2="345"/>
  <circle class="body" cx="236" cy="120" r="34"/>
  <rect class="body" x="191" y="158" width="90" height="106" rx="36"/>
  <line class="limb" x1="203" y1="182" x2="169" y2="256"/>
  <line class="limb" x1="269" y1="182" x2="303" y2="256"/>
  <line class="limb" x1="214" y1="260" x2="198" y2="337"/>
  <line class="limb" x1="258" y1="260" x2="274" y2="337"/>
  <circle class="joint" cx="198" cy="337" r="7"/><circle class="joint" cx="274" cy="337" r="7"/>
  <text class="note" x="131" y="373">足裏全体で床を踏む</text>

  <text class="label" x="534" y="62">② しゃがむ</text>
  <text class="note" x="534" y="90">お尻を後ろへ引きながら下がる</text>
  <line class="floor" x1="555" y1="345" x2="890" y2="345"/>
  <circle class="body" cx="714" cy="150" r="34"/>
  <rect class="body" x="675" y="184" width="92" height="98" rx="34" transform="rotate(14 721 233)"/>
  <line class="limb" x1="688" y1="205" x2="646" y2="267"/>
  <line class="limb" x1="750" y1="211" x2="790" y2="264"/>
  <line class="limb" x1="711" y1="274" x2="659" y2="302"/>
  <line class="limb" x1="659" y1="302" x2="629" y2="337"/>
  <line class="limb" x1="747" y1="276" x2="798" y2="303"/>
  <line class="limb" x1="798" y1="303" x2="831" y2="337"/>
  <circle class="joint" cx="659" cy="302" r="9"/><circle class="joint" cx="798" cy="303" r="9"/>
  <path class="arrow" d="M708 112C678 126 649 151 624 184"/>
  <line class="guide" x1="620" y1="195" x2="658" y2="195"/>
  <text class="note" x="560" y="373">深さより、かかとが浮かないことを優先</text>

  <text class="tip" x="480" y="408" text-anchor="middle">真下に落ちるより「後ろの椅子へ座る」イメージ</text>
</svg>
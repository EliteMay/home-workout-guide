<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">デッドバグの開始姿勢と反対の手足を伸ばした姿勢</title><desc id="desc">仰向けで手足を上げた位置から、反対側の腕と脚をゆっくり伸ばす。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79d7a5"/></marker><style>.panel{fill:#171a21;stroke:#2b323d;stroke-width:2}.label{fill:#79d7a5;font:800 21px system-ui,sans-serif}.note{fill:#aeb7c4;font:600 17px system-ui,sans-serif}.body{fill:#dce4eb}.limb{stroke:#dce4eb;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke:#dce4eb;stroke-width:16;stroke-linecap:round;fill:none}.accent{stroke:#79d7a5;stroke-width:8;stroke-linecap:round;fill:none}.floor{stroke:#46505d;stroke-width:5;stroke-linecap:round}.arrow{fill:none;stroke:#79d7a5;stroke-width:8;stroke-linecap:round;marker-end:url(#arrow)}.db{fill:#79d7a5}.tip{fill:#f2f4f7;font:800 21px system-ui,sans-serif}.chair{fill:none;stroke:#6c7784;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="960" height="420" rx="24" fill="#11151b"/><rect class="panel" x="24" y="24" width="430" height="372" rx="20"/><rect class="panel" x="506" y="24" width="430" height="372" rx="20"/><text class="label" x="52" y="62">① 開始</text><text class="note" x="52" y="90">両腕を上、股関節と膝を曲げる</text><line class="floor" x1="70" y1="322" x2="410" y2="322"/><circle class="body" cx="120" cy="282" r="24"/><line class="limb" x1="144" y1="289" x2="245" y2="292"/><line class="thin" x1="185" y1="288" x2="185" y2="194"/><line class="thin" x1="215" y1="290" x2="215" y2="194"/><line class="thin" x1="245" y1="292" x2="282" y2="230"/><line class="thin" x1="282" y1="230" x2="322" y2="259"/><line class="thin" x1="248" y1="292" x2="292" y2="247"/><line class="thin" x1="292" y1="247" x2="330" y2="277"/><text class="label" x="534" y="62">② 動作</text><text class="note" x="534" y="90">反対の手足をゆっくり伸ばす</text><line class="floor" x1="552" y1="322" x2="892" y2="322"/><circle class="body" cx="602" cy="282" r="24"/><line class="limb" x1="626" y1="289" x2="727" y2="292"/><line class="thin" x1="666" y1="288" x2="607" y2="232"/><line class="thin" x1="696" y1="290" x2="696" y2="194"/><line class="thin" x1="727" y1="292" x2="826" y2="314"/><line class="thin" x1="730" y1="292" x2="774" y2="247"/><line class="thin" x1="774" y1="247" x2="812" y2="277"/><path class="arrow" d="M645 213C623 219 611 227 605 237"/><path class="arrow" d="M770 292C792 304 811 310 824 312"/><text class="tip" x="480" y="408" text-anchor="middle">腰が大きく反る前で止める。動作は小さくてもよい</text></svg>
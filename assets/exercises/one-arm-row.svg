<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">ワンハンドダンベルローの開始姿勢と引いた姿勢</title><desc id="desc">安定した椅子に片手を置き、反対の手のダンベルを肩の下から腰方向へ引く。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79d7a5"/></marker><style>.panel{fill:#171a21;stroke:#2b323d;stroke-width:2}.label{fill:#79d7a5;font:800 21px system-ui,sans-serif}.note{fill:#aeb7c4;font:600 17px system-ui,sans-serif}.body{fill:#dce4eb}.limb{stroke:#dce4eb;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke:#dce4eb;stroke-width:16;stroke-linecap:round;fill:none}.accent{stroke:#79d7a5;stroke-width:8;stroke-linecap:round;fill:none}.floor{stroke:#46505d;stroke-width:5;stroke-linecap:round}.arrow{fill:none;stroke:#79d7a5;stroke-width:8;stroke-linecap:round;marker-end:url(#arrow)}.db{fill:#79d7a5}.tip{fill:#f2f4f7;font:800 21px system-ui,sans-serif}.chair{fill:none;stroke:#6c7784;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="960" height="420" rx="24" fill="#11151b"/><rect class="panel" x="24" y="24" width="430" height="372" rx="20"/><rect class="panel" x="506" y="24" width="430" height="372" rx="20"/><text class="label" x="52" y="62">① 開始</text><text class="note" x="52" y="90">片手を安定した椅子へ</text><path class="chair" d="M82 258H178V322M92 258V322"/><circle class="body" cx="240" cy="150" r="25"/><line class="limb" x1="225" y1="174" x2="188" y2="248"/><line class="limb" x1="188" y1="248" x2="115" y2="248"/><line class="limb" x1="246" y1="176" x2="294" y2="250"/><line class="thin" x1="294" y1="250" x2="300" y2="316"/><rect class="db" x="286" y="313" width="29" height="18" rx="4"/><line class="limb" x1="267" y1="192" x2="338" y2="268"/><line class="limb" x1="338" y1="268" x2="386" y2="318"/><text class="label" x="534" y="62">② 動作</text><text class="note" x="534" y="90">肘を腰の後ろへ引く</text><path class="chair" d="M564 258H660V322M574 258V322"/><circle class="body" cx="722" cy="150" r="25"/><line class="limb" x1="707" y1="174" x2="670" y2="248"/><line class="limb" x1="670" y1="248" x2="597" y2="248"/><line class="limb" x1="728" y1="176" x2="775" y2="232"/><line class="thin" x1="775" y1="232" x2="741" y2="184"/><rect class="db" x="728" y="171" width="29" height="18" rx="4"/><line class="limb" x1="749" y1="192" x2="820" y2="268"/><line class="limb" x1="820" y1="268" x2="868" y2="318"/><path class="arrow" d="M787 289C791 257 779 222 754 195"/><text class="tip" x="480" y="408" text-anchor="middle">胸を床へ向けたまま。体をひねって引かない</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">ショルダープレスの開始姿勢と終了姿勢</title>
  <desc id="desc">ダンベルを肩の横に構えた開始姿勢から、腰を反らしすぎず真上へ押し上げる。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79d7a5"/></marker>
    <style>
      .panel{fill:#171a21;stroke:#2b323d;stroke-width:2}.title{fill:#f2f4f7;font:700 24px system-ui,sans-serif}.label{fill:#79d7a5;font:800 21px system-ui,sans-serif}.note{fill:#aeb7c4;font:600 18px system-ui,sans-serif}.body{fill:#dce4eb}.limb{stroke:#dce4eb;stroke-width:24;stroke-linecap:round}.db{fill:#79d7a5;stroke:#0f1115;stroke-width:3}.arrow{fill:none;stroke:#79d7a5;stroke-width:8;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="960" height="420" rx="24" fill="#11151b"/>
  <rect class="panel" x="24" y="24" width="430" height="372" rx="20"/><rect class="panel" x="506" y="24" width="430" height="372" rx="20"/>
  <text class="label" x="52" y="62">① 開始</text><text class="note" x="52" y="90">ダンベルを肩の横に構える</text>
  <circle class="body" cx="239" cy="138" r="34"/><rect class="body" x="190" y="176" width="98" height="108" rx="38"/>
  <line class="limb" x1="199" y1="195" x2="153" y2="208"/><line class="limb" x1="153" y1="208" x2="153" y2="151"/>
  <line class="limb" x1="279" y1="195" x2="325" y2="208"/><line class="limb" x1="325" y1="208" x2="325" y2="151"/>
  <line class="limb" x1="216" y1="282" x2="196" y2="357"/><line class="limb" x1="262" y1="282" x2="282" y2="357"/>
  <g class="db" transform="translate(124 130)"><rect x="0" y="10" width="58" height="12" rx="6"/><rect x="-8" y="2" width="13" height="28" rx="4"/><rect x="53" y="2" width="13" height="28" rx="4"/></g>
  <g class="db" transform="translate(296 130)"><rect x="0" y="10" width="58" height="12" rx="6"/><rect x="-8" y="2" width="13" height="28" rx="4"/><rect x="53" y="2" width="13" height="28" rx="4"/></g>
  <text class="label" x="534" y="62">② 真上へ</text><text class="note" x="534" y="90">お腹に力を入れ、腰を反らしすぎない</text>
  <circle class="body" cx="721" cy="156" r="34"/><rect class="body" x="672" y="194" width="98" height="90" rx="36"/>
  <line class="limb" x1="687" y1="204" x2="654" y2="126"/><line class="limb" x1="654" y1="126" x2="654" y2="70"/>
  <line class="limb" x1="755" y1="204" x2="788" y2="126"/><line class="limb" x1="788" y1="126" x2="788" y2="70"/>
  <line class="limb" x1="698" y1="282" x2="678" y2="357"/><line class="limb" x1="744" y1="282" x2="764" y2="357"/>
  <g class="db" transform="translate(625 48)"><rect x="0" y="10" width="58" height="12" rx="6"/><rect x="-8" y="2" width="13" height="28" rx="4"/><rect x="53" y="2" width="13" height="28" rx="4"/></g>
  <g class="db" transform="translate(759 48)"><rect x="0" y="10" width="58" height="12" rx="6"/><rect x="-8" y="2" width="13" height="28" rx="4"/><rect x="53" y="2" width="13" height="28" rx="4"/></g>
  <path class="arrow" d="M601 177L601 95"/><path class="arrow" d="M841 177L841 95"/>
  <text class="title" x="480" y="405" text-anchor="middle">肩の横 → 頭の上へまっすぐ押す</text>
</svg>
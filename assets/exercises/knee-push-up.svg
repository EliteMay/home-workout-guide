<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">膝つき腕立て伏せの開始姿勢と下げた姿勢</title><desc id="desc">左は膝を床につけて頭から膝までを一直線にした開始姿勢。右は一直線を保ったまま胸を床へ近づけた姿勢。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79d7a5"/></marker><style>.panel{fill:#171a21;stroke:#2b323d;stroke-width:2}.label{fill:#79d7a5;font:800 21px system-ui,sans-serif}.note{fill:#aeb7c4;font:600 17px system-ui,sans-serif}.body{fill:#dce4eb}.limb{stroke:#dce4eb;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke:#dce4eb;stroke-width:16;stroke-linecap:round;fill:none}.accent{stroke:#79d7a5;stroke-width:8;stroke-linecap:round;fill:none}.floor{stroke:#46505d;stroke-width:5;stroke-linecap:round}.arrow{fill:none;stroke:#79d7a5;stroke-width:8;stroke-linecap:round;marker-end:url(#arrow)}.db{fill:#79d7a5}.tip{fill:#f2f4f7;font:800 21px system-ui,sans-serif}.chair{fill:none;stroke:#6c7784;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="960" height="420" rx="24" fill="#11151b"/><rect class="panel" x="24" y="24" width="430" height="372" rx="20"/><rect class="panel" x="506" y="24" width="430" height="372" rx="20"/><text class="label" x="52" y="62">① 開始</text><text class="note" x="52" y="90">膝を床につけ、頭→膝を一直線に</text><line class="floor" x1="70" y1="330" x2="405" y2="330"/><circle class="body" cx="126" cy="182" r="27"/><line class="limb" x1="151" y1="192" x2="255" y2="230"/><line class="limb" x1="255" y1="230" x2="320" y2="282"/><line class="limb" x1="190" y1="207" x2="180" y2="276"/><line class="limb" x1="180" y1="276" x2="180" y2="320"/><line class="limb" x1="320" y1="282" x2="344" y2="320"/><line class="accent" x1="143" y1="188" x2="323" y2="283"/><text class="label" x="534" y="62">② 動作</text><text class="note" x="534" y="90">胸を手の間へ近づける</text><line class="floor" x1="552" y1="330" x2="888" y2="330"/><circle class="body" cx="610" cy="244" r="27"/><line class="limb" x1="635" y1="248" x2="742" y2="264"/><line class="limb" x1="742" y1="264" x2="812" y2="291"/><line class="limb" x1="670" y1="254" x2="650" y2="293"/><line class="limb" x1="650" y1="293" x2="650" y2="320"/><line class="limb" x1="812" y1="291" x2="838" y2="320"/><line class="accent" x1="625" y1="246" x2="815" y2="292"/><path class="arrow" d="M590 135C570 176 571 215 581 242"/><text class="tip" x="480" y="408" text-anchor="middle">お尻を引かず、頭から膝までを1本の板みたいに保つ</text></svg>
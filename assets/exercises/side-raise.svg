<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">サイドレイズの開始姿勢と腕を横へ上げた姿勢</title><desc id="desc">左は体の横にダンベルを持った姿勢。右は肘を軽く曲げたまま腕を左右へ上げた姿勢。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79d7a5"/></marker><style>.panel{fill:#171a21;stroke:#2b323d;stroke-width:2}.label{fill:#79d7a5;font:800 21px system-ui,sans-serif}.note{fill:#aeb7c4;font:600 17px system-ui,sans-serif}.body{fill:#dce4eb}.limb{stroke:#dce4eb;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke:#dce4eb;stroke-width:16;stroke-linecap:round;fill:none}.accent{stroke:#79d7a5;stroke-width:8;stroke-linecap:round;fill:none}.floor{stroke:#46505d;stroke-width:5;stroke-linecap:round}.arrow{fill:none;stroke:#79d7a5;stroke-width:8;stroke-linecap:round;marker-end:url(#arrow)}.db{fill:#79d7a5}.tip{fill:#f2f4f7;font:800 21px system-ui,sans-serif}.chair{fill:none;stroke:#6c7784;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="960" height="420" rx="24" fill="#11151b"/><rect class="panel" x="24" y="24" width="430" height="372" rx="20"/><rect class="panel" x="506" y="24" width="430" height="372" rx="20"/><text class="label" x="52" y="62">① 開始</text><text class="note" x="52" y="90">ダンベルを体の横へ</text><circle class="body" cx="238" cy="142" r="26"/><line class="limb" x1="238" y1="170" x2="238" y2="260"/><line class="limb" x1="225" y1="190" x2="188" y2="277"/><line class="limb" x1="251" y1="190" x2="288" y2="277"/><rect class="db" x="170" y="274" width="30" height="18" rx="4"/><rect class="db" x="276" y="274" width="30" height="18" rx="4"/><line class="limb" x1="230" y1="258" x2="202" y2="322"/><line class="limb" x1="246" y1="258" x2="274" y2="322"/><text class="label" x="534" y="62">② 動作</text><text class="note" x="534" y="90">肩の横へゆっくり上げる</text><circle class="body" cx="720" cy="142" r="26"/><line class="limb" x1="720" y1="170" x2="720" y2="260"/><line class="limb" x1="706" y1="191" x2="618" y2="210"/><line class="limb" x1="734" y1="191" x2="822" y2="210"/><rect class="db" x="598" y="201" width="31" height="18" rx="4"/><rect class="db" x="816" y="201" width="31" height="18" rx="4"/><line class="limb" x1="712" y1="258" x2="684" y2="322"/><line class="limb" x1="728" y1="258" x2="756" y2="322"/><path class="arrow" d="M641 272C623 251 615 230 615 215"/><path class="arrow" d="M799 272C817 251 825 230 825 215"/><text class="tip" x="480" y="408" text-anchor="middle">肩をすくめず、反動なし。肩の高さより無理に上げない</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">ダンベルフロアプレスの開始姿勢と押し上げた姿勢</title><desc id="desc">左は床に仰向けで肘を曲げダンベルを胸の横に構えた姿勢。右は胸の上へダンベルを押し上げた姿勢。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79d7a5"/></marker><style>.panel{fill:#171a21;stroke:#2b323d;stroke-width:2}.label{fill:#79d7a5;font:800 21px system-ui,sans-serif}.note{fill:#aeb7c4;font:600 17px system-ui,sans-serif}.body{fill:#dce4eb}.limb{stroke:#dce4eb;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke:#dce4eb;stroke-width:16;stroke-linecap:round;fill:none}.accent{stroke:#79d7a5;stroke-width:8;stroke-linecap:round;fill:none}.floor{stroke:#46505d;stroke-width:5;stroke-linecap:round}.arrow{fill:none;stroke:#79d7a5;stroke-width:8;stroke-linecap:round;marker-end:url(#arrow)}.db{fill:#79d7a5}.tip{fill:#f2f4f7;font:800 21px system-ui,sans-serif}.chair{fill:none;stroke:#6c7784;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="960" height="420" rx="24" fill="#11151b"/><rect class="panel" x="24" y="24" width="430" height="372" rx="20"/><rect class="panel" x="506" y="24" width="430" height="372" rx="20"/><text class="label" x="52" y="62">① 開始</text><text class="note" x="52" y="90">仰向け。肘は床近くで止める</text><line class="floor" x1="70" y1="320" x2="410" y2="320"/><circle class="body" cx="118" cy="264" r="25"/><line class="limb" x1="143" y1="272" x2="267" y2="282"/><line class="limb" x1="267" y1="282" x2="345" y2="315"/><line class="thin" x1="190" y1="273" x2="168" y2="217"/><line class="thin" x1="168" y1="217" x2="204" y2="181"/><rect class="db" x="190" y="164" width="29" height="18" rx="4"/><line class="thin" x1="224" y1="276" x2="248" y2="219"/><line class="thin" x1="248" y1="219" x2="220" y2="181"/><rect class="db" x="206" y="164" width="29" height="18" rx="4"/><text class="label" x="534" y="62">② 動作</text><text class="note" x="534" y="90">胸の上へまっすぐ押す</text><line class="floor" x1="552" y1="320" x2="892" y2="320"/><circle class="body" cx="600" cy="264" r="25"/><line class="limb" x1="625" y1="272" x2="749" y2="282"/><line class="limb" x1="749" y1="282" x2="827" y2="315"/><line class="thin" x1="672" y1="274" x2="672" y2="154"/><line class="thin" x1="706" y1="276" x2="706" y2="154"/><rect class="db" x="657" y="137" width="30" height="18" rx="4"/><rect class="db" x="691" y="137" width="30" height="18" rx="4"/><path class="arrow" d="M640 236C631 206 633 178 649 155"/><text class="tip" x="480" y="408" text-anchor="middle">肩をすくめず、手首を前腕と一直線にする</text></svg>
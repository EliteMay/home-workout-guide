<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">腕立て伏せの開始姿勢と下げた姿勢</title>
  <desc id="desc">左は頭からかかとまでを一直線にして腕を伸ばした開始姿勢。右は一直線を保ったまま胸を床へ近づけた姿勢。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79d7a5"/></marker>
    <style>
      .panel{fill:#171a21;stroke:#2b323d;stroke-width:2}.label{fill:#79d7a5;font:800 21px system-ui,sans-serif}.note{fill:#aeb7c4;font:600 18px system-ui,sans-serif}.body{fill:#dce4eb}.limb{stroke:#dce4eb;stroke-width:24;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:#79d7a5;stroke-width:8;stroke-linecap:round}.floor{stroke:#46505d;stroke-width:5;stroke-linecap:round}.arrow{fill:none;stroke:#79d7a5;stroke-width:8;stroke-linecap:round;marker-end:url(#arrow)}.tip{fill:#f2f4f7;font:800 22px system-ui,sans-serif}
    </style>
  </defs>
  <rect width="960" height="420" rx="24" fill="#11151b"/>
  <rect class="panel" x="24" y="24" width="430" height="372" rx="20"/>
  <rect class="panel" x="506" y="24" width="430" height="372" rx="20"/>

  <text class="label" x="52" y="62">① 開始</text>
  <text class="note" x="52" y="90">腕を伸ばし、体を一直線に</text>
  <line class="floor" x1="74" y1="330" x2="405" y2="330"/>
  <circle class="body" cx="132" cy="170" r="28"/>
  <line class="limb" x1="158" y1="180" x2="270" y2="225"/>
  <line class="limb" x1="270" y1="225" x2="360" y2="270"/>
  <line class="limb" x1="190" y1="195" x2="175" y2="267"/>
  <line class="limb" x1="175" y1="267" x2="171" y2="320"/>
  <line class="limb" x1="218" y1="207" x2="224" y2="274"/>
  <line class="limb" x1="224" y1="274" x2="225" y2="320"/>
  <line class="limb" x1="360" y1="270" x2="391" y2="316"/>
  <line class="accent" x1="146" y1="176" x2="364" y2="272"/>
  <text class="note" x="105" y="362">頭 → 背中 → お尻 → かかと</text>

  <text class="label" x="534" y="62">② 下げる</text>
  <text class="note" x="534" y="90">一直線のまま、胸を床へ近づける</text>
  <line class="floor" x1="556" y1="330" x2="887" y2="330"/>
  <circle class="body" cx="614" cy="232" r="28"/>
  <line class="limb" x1="640" y1="238" x2="752" y2="258"/>
  <line class="limb" x1="752" y1="258" x2="844" y2="279"/>
  <line class="limb" x1="676" y1="245" x2="646" y2="286"/>
  <line class="limb" x1="646" y1="286" x2="646" y2="320"/>
  <line class="limb" x1="704" y1="250" x2="728" y2="286"/>
  <line class="limb" x1="728" y1="286" x2="728" y2="320"/>
  <line class="limb" x1="844" y1="279" x2="875" y2="318"/>
  <line class="accent" x1="628" y1="236" x2="848" y2="280"/>
  <path class="arrow" d="M590 132C568 171 566 203 576 233"/>
  <text class="note" x="566" y="362">肘は真横に開きすぎない</text>

  <text class="tip" x="480" y="408" text-anchor="middle">体を1本の板みたいに保ったまま、胸を下げて押し戻す</text>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">ハンマーカールの開始姿勢と曲げた姿勢</title><desc id="desc">手のひらを内側へ向けたまま、ダンベルを体の横から肩方向へ上げる。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79d7a5"/></marker><style>.panel{fill:#171a21;stroke:#2b323d;stroke-width:2}.label{fill:#79d7a5;font:800 21px system-ui,sans-serif}.note{fill:#aeb7c4;font:600 17px system-ui,sans-serif}.body{fill:#dce4eb}.limb{stroke:#dce4eb;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke:#dce4eb;stroke-width:16;stroke-linecap:round;fill:none}.accent{stroke:#79d7a5;stroke-width:8;stroke-linecap:round;fill:none}.floor{stroke:#46505d;stroke-width:5;stroke-linecap:round}.arrow{fill:none;stroke:#79d7a5;stroke-width:8;stroke-linecap:round;marker-end:url(#arrow)}.db{fill:#79d7a5}.tip{fill:#f2f4f7;font:800 21px system-ui,sans-serif}.chair{fill:none;stroke:#6c7784;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="960" height="420" rx="24" fill="#11151b"/><rect class="panel" x="24" y="24" width="430" height="372" rx="20"/><rect class="panel" x="506" y="24" width="430" height="372" rx="20"/><text class="label" x="52" y="62">① 開始</text><text class="note" x="52" y="90">親指を前へ向けて構える</text><circle class="body" cx="240" cy="140" r="26"/><line class="limb" x1="240" y1="168" x2="240" y2="258"/><line class="limb" x1="222" y1="190" x2="200" y2="275"/><line class="limb" x1="258" y1="190" x2="280" y2="275"/><rect class="db" x="190" y="270" width="18" height="34" rx="4"/><rect class="db" x="272" y="270" width="18" height="34" rx="4"/><line class="limb" x1="232" y1="257" x2="204" y2="322"/><line class="limb" x1="248" y1="257" x2="276" y2="322"/><text class="label" x="534" y="62">② 動作</text><text class="note" x="534" y="90">握りを縦のまま肘を曲げる</text><circle class="body" cx="720" cy="140" r="26"/><line class="limb" x1="720" y1="168" x2="720" y2="258"/><line class="limb" x1="702" y1="190" x2="676" y2="226"/><line class="limb" x1="676" y1="226" x2="690" y2="180"/><line class="limb" x1="738" y1="190" x2="764" y2="226"/><line class="limb" x1="764" y1="226" x2="750" y2="180"/><rect class="db" x="681" y="161" width="18" height="34" rx="4"/><rect class="db" x="741" y="161" width="18" height="34" rx="4"/><line class="limb" x1="712" y1="257" x2="684" y2="322"/><line class="limb" x1="728" y1="257" x2="756" y2="322"/><path class="arrow" d="M660 263C663 225 672 197 687 179"/><text class="tip" x="480" y="408" text-anchor="middle">肘を体の横に置き、腰を振って上げない</text></svg>
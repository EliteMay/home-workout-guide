<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">クランチの開始姿勢と上体を丸めた姿勢</title><desc id="desc">仰向けで膝を曲げ、肩甲骨が床から少し離れるまで上体を丸める。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79d7a5"/></marker><style>.panel{fill:#171a21;stroke:#2b323d;stroke-width:2}.label{fill:#79d7a5;font:800 21px system-ui,sans-serif}.note{fill:#aeb7c4;font:600 17px system-ui,sans-serif}.body{fill:#dce4eb}.limb{stroke:#dce4eb;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke:#dce4eb;stroke-width:16;stroke-linecap:round;fill:none}.accent{stroke:#79d7a5;stroke-width:8;stroke-linecap:round;fill:none}.floor{stroke:#46505d;stroke-width:5;stroke-linecap:round}.arrow{fill:none;stroke:#79d7a5;stroke-width:8;stroke-linecap:round;marker-end:url(#arrow)}.db{fill:#79d7a5}.tip{fill:#f2f4f7;font:800 21px system-ui,sans-serif}.chair{fill:none;stroke:#6c7784;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="960" height="420" rx="24" fill="#11151b"/><rect class="panel" x="24" y="24" width="430" height="372" rx="20"/><rect class="panel" x="506" y="24" width="430" height="372" rx="20"/><text class="label" x="52" y="62">① 開始</text><text class="note" x="52" y="90">仰向け。膝を曲げる</text><line class="floor" x1="70" y1="320" x2="410" y2="320"/><circle class="body" cx="120" cy="271" r="25"/><line class="limb" x1="145" y1="280" x2="254" y2="287"/><line class="limb" x1="254" y1="287" x2="311" y2="244"/><line class="limb" x1="311" y1="244" x2="353" y2="319"/><line class="thin" x1="177" y1="281" x2="155" y2="248"/><text class="label" x="534" y="62">② 動作</text><text class="note" x="534" y="90">肩甲骨が少し浮くまで丸める</text><line class="floor" x1="552" y1="320" x2="892" y2="320"/><circle class="body" cx="615" cy="230" r="25"/><line class="limb" x1="638" y1="244" x2="736" y2="286"/><line class="limb" x1="736" y1="286" x2="793" y2="244"/><line class="limb" x1="793" y1="244" x2="835" y2="319"/><line class="thin" x1="665" y1="254" x2="640" y2="218"/><path class="arrow" d="M589 286C584 263 591 244 604 232"/><text class="tip" x="480" y="408" text-anchor="middle">首を手で引かず、腹を縮める小さな動きで十分</text></svg>
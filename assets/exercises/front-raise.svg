<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc"><title id="title">フロントレイズの開始姿勢と腕を前へ上げた姿勢</title><desc id="desc">左は太ももの前にダンベルを持った姿勢。右は腕を前方へ肩の高さ付近まで上げた姿勢。</desc><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#79d7a5"/></marker><style>.panel{fill:#171a21;stroke:#2b323d;stroke-width:2}.label{fill:#79d7a5;font:800 21px system-ui,sans-serif}.note{fill:#aeb7c4;font:600 17px system-ui,sans-serif}.body{fill:#dce4eb}.limb{stroke:#dce4eb;stroke-width:22;stroke-linecap:round;stroke-linejoin:round;fill:none}.thin{stroke:#dce4eb;stroke-width:16;stroke-linecap:round;fill:none}.accent{stroke:#79d7a5;stroke-width:8;stroke-linecap:round;fill:none}.floor{stroke:#46505d;stroke-width:5;stroke-linecap:round}.arrow{fill:none;stroke:#79d7a5;stroke-width:8;stroke-linecap:round;marker-end:url(#arrow)}.db{fill:#79d7a5}.tip{fill:#f2f4f7;font:800 21px system-ui,sans-serif}.chair{fill:none;stroke:#6c7784;stroke-width:10;stroke-linecap:round;stroke-linejoin:round}</style></defs><rect width="960" height="420" rx="24" fill="#11151b"/><rect class="panel" x="24" y="24" width="430" height="372" rx="20"/><rect class="panel" x="506" y="24" width="430" height="372" rx="20"/><text class="label" x="52" y="62">① 開始</text><text class="note" x="52" y="90">太ももの前で構える</text><circle class="body" cx="240" cy="142" r="26"/><line class="limb" x1="240" y1="170" x2="240" y2="260"/><line class="limb" x1="226" y1="192" x2="211" y2="274"/><line class="limb" x1="254" y1="192" x2="269" y2="274"/><rect class="db" x="195" y="271" width="30" height="18" rx="4"/><rect class="db" x="255" y="271" width="30" height="18" rx="4"/><line class="limb" x1="232" y1="258" x2="204" y2="322"/><line class="limb" x1="248" y1="258" x2="276" y2="322"/><text class="label" x="534" y="62">② 動作</text><text class="note" x="534" y="90">腕を前へ肩の高さ付近まで</text><circle class="body" cx="720" cy="142" r="26"/><line class="limb" x1="720" y1="170" x2="720" y2="260"/><line class="limb" x1="706" y1="192" x2="634" y2="205"/><line class="limb" x1="734" y1="192" x2="806" y2="205"/><rect class="db" x="615" y="196" width="31" height="18" rx="4"/><rect class="db" x="800" y="196" width="31" height="18" rx="4"/><line class="limb" x1="712" y1="258" x2="684" y2="322"/><line class="limb" x1="728" y1="258" x2="756" y2="322"/><path class="arrow" d="M674 269C648 248 637 225 636 211"/><text class="tip" x="480" y="408" text-anchor="middle">腰を反らさず、肩をすくめない</text></svg>